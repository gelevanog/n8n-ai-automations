# Relay: self-hosted n8n + the AI gateway + mock business systems, all on one machine.
#   docker compose up --build        (first start imports the workflows into n8n)
#     dashboard          http://localhost:3000
#     n8n editor         http://localhost:5678   (create the local owner account on first visit, or `make n8n-owner`)
#     Relay API          http://localhost:8100   (OpenAPI docs at /docs)
#     mock systems       http://localhost:8200   (CRM, helpdesk, accounting, chat, fixture websites)
#     Mailpit (email)    http://localhost:8025   (SMTP on localhost:1025)
# With no keys the offline rules model answers. For free cloud models put OPENROUTER_API_KEY and
# RELAY_LLM_PROVIDER=openrouter in .env (see README > Run with free models).
name: relay

x-relay: &relay
  build: .
  image: relay-api:latest
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: relay
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-relay}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-relay-local-demo-encryption-key}
  GENERIC_TIMEZONE: Europe/Amsterdam
  TZ: Europe/Amsterdam
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_HIRING_BANNER_ENABLED: "false"
  # The workflows read service URLs from the environment (portable between machines without editing nodes).
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  RELAY_API_URL: http://relay:8100
  MOCKS_URL: http://mocks:8200
  N8N_INTERNAL_URL: http://n8n:5678
  N8N_WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "168"
  N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay}
      POSTGRES_DB: relay
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55470}:5432"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.5
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "5000"
      # Every received message is announced to Relay, which forwards mail for the shared inbox to inbox triage.
      MP_WEBHOOK_URL: http://relay:8100/inbound/mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "${SMTP_PORT:-1025}:1025"
    restart: unless-stopped

  mocks:
    <<: *relay
    command: ["uvicorn", "relay.mocks.app:create_default_app", "--factory", "--host", "0.0.0.0", "--port", "8200"]
    environment:
      RELAY_MOCKS_DATABASE_URL: postgresql://relay:${POSTGRES_PASSWORD:-relay}@postgres:5432/mocks
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MOCKS_PORT:-8200}:8200"

  relay:
    <<: *relay
    environment:
      RELAY_DATABASE_URL: postgresql://relay:${POSTGRES_PASSWORD:-relay}@postgres:5432/relay
      RELAY_LLM_PROVIDER: ${RELAY_LLM_PROVIDER:-fake}
      RELAY_N8N_URL: http://n8n:5678
      RELAY_N8N_WEBHOOK_TOKEN: ${RELAY_WEBHOOK_TOKEN:-relay-local-webhook-token}
      RELAY_API_TOKEN: ${RELAY_API_TOKEN:-relay-local-api-token}
      RELAY_MOCKS_URL: http://mocks:8200
      RELAY_MAILPIT_URL: http://mailpit:8025
      RELAY_SITES_BASE_URL: http://mocks:8200/sites
      RELAY_CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
    volumes:
      - llmcache:/home/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      mocks:
        condition: service_healthy
    ports:
      - "${RELAY_PORT:-8100}:8100"

  n8n-import:
    image: n8nio/n8n:2.42.7
    entrypoint: ["/bin/sh", "/bootstrap/import.sh"]
    environment:
      <<: *n8n-env
      RELAY_WEBHOOK_TOKEN: ${RELAY_WEBHOOK_TOKEN:-relay-local-webhook-token}
      RELAY_API_TOKEN: ${RELAY_API_TOKEN:-relay-local-api-token}
      RELAY_DB_PASSWORD: ${POSTGRES_PASSWORD:-relay}
    volumes:
      - ./n8n/workflows:/workflows:ro
      - ./n8n/bootstrap:/bootstrap:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  n8n:
    image: n8nio/n8n:2.42.7
    environment:
      <<: *n8n-env
    volumes:
      - n8ndata:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      relay:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${RELAY_PORT:-8100}
        NEXT_PUBLIC_API_TOKEN: ${RELAY_API_TOKEN:-relay-local-api-token}
        NEXT_PUBLIC_N8N_URL: http://localhost:${N8N_PORT:-5678}
    image: relay-web:latest
    profiles: ["web"]
    depends_on:
      relay:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
  n8ndata:
  llmcache:
