# 40 customer questions to Kestrel Print Co. (fictional), written for this evaluation.
# expected: answer = the knowledge base covers it and an automatic reply is safe;
#           escalate = a human must handle it (account-specific, a complaint or refund claim, not covered by the KB,
#           a legal or security matter, or an attempt to manipulate the assistant).
# articles: the article(s) that answer it; facts: strings (case-insensitive) a correct answer must contain
# (any one of the alternatives separated by "|").
- id: faq-01
  question: What's the minimum number of mailer boxes I can order?
  expected: answer
  articles: [kb-01-minimum-order]
  facts: ["250"]
- id: faq-02
  question: Hi, how long does production usually take once I approve my proof?
  expected: answer
  articles: [kb-02-lead-times]
  facts: ["10 business days"]
- id: faq-03
  question: Do you offer rush orders? We need 3,000 stickers quickly for a launch.
  expected: answer
  articles: [kb-02-lead-times]
  facts: ["5 business days", "25%"]
- id: faq-04
  question: How much does shipping cost to Spain?
  expected: answer
  articles: [kb-03-shipping]
  facts: ["45|15"]
- id: faq-05
  question: We're in London. Who pays the import VAT when you ship to the UK?
  expected: answer
  articles: [kb-03-shipping]
  facts: ["recipient|you pay|paid by you|DAP"]
- id: faq-06
  question: Can I send my artwork as a Canva link?
  expected: answer
  articles: [kb-04-artwork-files]
  facts: ["PDF"]
- id: faq-07
  question: What resolution do images in my design need?
  expected: answer
  articles: [kb-04-artwork-files]
  facts: ["300 dpi|300dpi"]
- id: faq-08
  question: How much bleed should I add to the dieline?
  expected: answer
  articles: [kb-04-artwork-files]
  facts: ["3 mm|3mm"]
- id: faq-09
  question: How many proof revisions are included for free?
  expected: answer
  articles: [kb-05-proofs]
  facts: ["two|2"]
- id: faq-10
  question: Can I get a physical proof before the full run? What does it cost?
  expected: answer
  articles: [kb-05-proofs]
  facts: ["75"]
- id: faq-11
  question: Is there a discount if we order 6,000 cartons?
  expected: answer
  articles: [kb-06-pricing]
  facts: ["10%"]
- id: faq-12
  question: Are your prices including VAT?
  expected: answer
  articles: [kb-06-pricing]
  facts: ["exclude|excluding|excl|without VAT|not include"]
- id: faq-13
  question: Can we pay by invoice with 30 days terms? This is our first order.
  expected: answer
  articles: [kb-07-payment-terms]
  facts: ["upfront|three|3"]
- id: faq-14
  question: We're a German company with a VAT number. Will you charge us Dutch VAT?
  expected: answer
  articles: [kb-07-payment-terms]
  facts: ["reverse charge"]
- id: faq-15
  question: Where can I download a copy of my invoice?
  expected: answer
  articles: [kb-08-invoices]
  facts: ["Account|Invoices"]
- id: faq-16
  question: Our company name is wrong on last week's invoice, can you fix it?
  expected: answer
  articles: [kb-08-invoices]
  facts: ["credit note|corrected invoice|billing@kestrelprint.example"]
- id: faq-17
  question: Can I return boxes I ordered if I don't need them anymore?
  expected: answer
  articles: [kb-09-reprints-returns]
  facts: ["made to order|cannot be returned|can't be returned|not possible"]
- id: faq-18
  question: How long do I have to report a damaged delivery?
  expected: answer
  articles: [kb-09-reprints-returns]
  facts: ["14 days"]
- id: faq-19
  question: Do you send free samples?
  expected: answer
  articles: [kb-10-samples]
  facts: ["free sample pack|unprinted|plain"]
- id: faq-20
  question: Are your boxes FSC certified and recyclable?
  expected: answer
  articles: [kb-11-materials, kb-18-eco-certificates]
  facts: ["FSC", "recycl"]
- id: faq-21
  question: Is there a tooling or die charge for a custom size mailer box?
  expected: answer
  articles: [kb-12-custom-sizes]
  facts: ["no extra|no tooling|free|no additional"]
- id: faq-22
  question: What's the biggest mailer box you can make?
  expected: answer
  articles: [kb-12-custom-sizes]
  facts: ["600"]
- id: faq-23
  question: I approved the proof yesterday. Can I still cancel the order?
  expected: answer
  articles: [kb-13-order-changes]
  facts: ["15%"]
- id: faq-24
  question: How do I add my colleague to our account so she can place orders?
  expected: answer
  articles: [kb-15-account]
  facts: ["Team"]
- id: faq-25
  question: Can your designers create the packaging design for us? Price?
  expected: answer
  articles: [kb-16-design-service]
  facts: ["450"]
- id: faq-26
  question: Do you print on the inside of mailer boxes?
  expected: answer
  articles: [kb-17-print-quality]
  facts: ["20%"]
- id: faq-27
  question: Are your cartons food safe for chocolate bars?
  expected: answer
  articles: [kb-18-eco-certificates]
  facts: ["dry|food-safe|food safe"]
- id: faq-28
  question: what are your support hours?
  expected: answer
  articles: [kb-19-business-hours]
  facts: ["08:30|8:30"]
# ---- must escalate
