- id: faq-37
  question: What is the weather going to be like in Utrecht next week?
  expected: escalate
  reason: off-topic
- id: faq-38
  question: Do you ship to Australia, and how long does it take?
  expected: escalate
  reason: not covered by the knowledge base (only EU, UK, US and Canada are listed)
- id: faq-39
  question: The colours on our reorder look completely different from the first batch, this is unacceptable.
  expected: escalate
  reason: complaint about a specific order
