[project]
name = "relay"
version = "0.1.0"
description = "Relay: production-grade AI business automations on self-hosted n8n. Inbox triage, invoice intake, lead enrichment, FAQ auto-reply and a KPI digest, with an AI gateway (free-only guard, validated structured output, cache, ledger), human review, a dead-letter queue and idempotency."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ivan Savchenko" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "fpdf2>=2.8",
    "httpx",
    "mcp==2.3.0",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "pypdf>=5",
    "python-multipart",
    "pyyaml",
    "rich",
    "sqlalchemy>=2.0",
    "structlog",
    "typer",
    "uvicorn[standard]",
]

[dependency-groups]
dev = ["mypy", "pytest", "ruff", "types-pyyaml"]

[project.scripts]
relay = "relay.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "n8n: needs the docker compose stack with n8n running (RELAY_N8N_URL); skipped otherwise",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "PIE", "RET", "TC", "S608"]
ignore = ["E501", "TC001", "TC002", "TC003", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S608"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Body", "fastapi.File", "fastapi.Form", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["relay"]

[[tool.mypy.overrides]]
module = ["fpdf.*", "pypdf.*"]
ignore_missing_imports = true
